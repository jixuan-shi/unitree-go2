footprint_to_odom_ekf:
  ros__parameters:
    frequency: 50.0
    publish_tf: true
    transform_timeout: 0.1
    two_d_mode: true

    # Gazebo p3d plugin: world -> base_link on topic odom/ground_truth
    odom0: odom/ground_truth
    odom0_config: [true,  true,  false,
                  false, false, true,
                   true,  true,  false,
                  false, false, true,
                  false, false, false]

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
